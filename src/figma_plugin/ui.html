<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Talk to Figma MCP</title>
    <style>
      /* 피그마 테마 색(themeColors: true)을 따르고, 없으면 다크 기본값 */
      :root {
        --bg: var(--figma-color-bg, #1e1e1e);
        --bg2: var(--figma-color-bg-secondary, #2c2c2c);
        --text: var(--figma-color-text, #e6e6e6);
        --text2: var(--figma-color-text-secondary, #a0a0a0);
        --border: var(--figma-color-border, #3d3d3d);
        --brand: var(--figma-color-bg-brand, #0d99ff);
        --on-brand: var(--figma-color-text-onbrand, #ffffff);
        --ok: var(--figma-color-text-success, #3dd68c);
        --bad: var(--figma-color-text-danger, #ff6b6b);
        --warn: var(--figma-color-text-warning, #f5b740);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 12px;
        font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      .file { margin-bottom: 10px; }
      .file-name { font-size: 14px; font-weight: 600; word-break: break-all; }
      .file-page { color: var(--text2); margin-top: 2px; }

      .card {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 10px;
        background: var(--bg2);
      }
      .status-line { display: flex; align-items: center; gap: 6px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; }
      .dot.on { background: var(--ok); }
      .dot.wait { background: var(--warn); }
      .status-text { flex: 1; }

      .channel-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
      .channel {
        flex: 1;
        font: 600 20px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 1px;
        user-select: all;
      }
      .hint { color: var(--text2); margin-top: 6px; }
      .hint code { font-family: ui-monospace, Menlo, monospace; }

      button {
        font: inherit;
        border: none;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        background: var(--brand);
        color: var(--on-brand);
      }
      button.ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
      button:disabled { opacity: 0.4; cursor: default; }

      .controls { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
      .controls input {
        width: 64px;
        font: inherit;
        padding: 5px 6px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
      }
      .controls label { color: var(--text2); }
      .spacer { flex: 1; }

      .progress { margin-top: 8px; }
      .bar { height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; margin-top: 4px; }
      .bar > div { height: 100%; width: 0; background: var(--brand); transition: width 0.3s; }

      .log-head { display: flex; justify-content: space-between; color: var(--text2); margin-bottom: 4px; }
      .log { list-style: none; margin: 0; padding: 0; }
      .log li {
        display: grid;
        grid-template-columns: 14px 1fr auto;
        gap: 6px;
        padding: 3px 0;
        border-top: 1px solid var(--border);
      }
      .log li:first-child { border-top: none; }
      .log .mark.ok { color: var(--ok); }
      .log .mark.bad { color: var(--bad); }
      .log .mark.run { color: var(--warn); }
      .log .cmd { font-family: ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .log .ms { color: var(--text2); }
      .log .err { grid-column: 2 / 4; color: var(--bad); word-break: break-all; }
      .empty { color: var(--text2); }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="file">
      <div class="file-name" id="file-name">파일 확인 중…</div>
      <div class="file-page" id="file-page"></div>
    </div>

    <div class="card">
      <div class="status-line">
        <span class="dot" id="dot"></span>
        <span class="status-text" id="status">연결되지 않음</span>
      </div>
      <div class="channel-row">
        <span class="channel" id="channel">--------</span>
        <button id="btn-copy" disabled>복사</button>
      </div>
      <div class="hint" id="hint">Claude Code 에 붙여 넣으면 접속합니다.</div>
      <div class="controls">
        <button id="btn-connect">연결</button>
        <span class="spacer"></span>
        <label for="port">포트</label>
        <input type="number" id="port" value="3055" min="1024" max="65535" />
      </div>
      <div class="progress hidden" id="progress">
        <div id="progress-message"></div>
        <div class="bar"><div id="progress-bar"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="log-head"><span>최근 명령</span><span id="log-count"></span></div>
      <ul class="log" id="log"></ul>
      <div class="empty" id="log-empty">아직 받은 명령이 없습니다.</div>
    </div>

    <script>
      const state = {
        connected: false,
        socket: null,
        serverPort: 3055,
        channel: null,
        pendingRequests: new Map(),
        activeRequestId: null,
      };

      const $ = (id) => document.getElementById(id);
      const portInput = $("port");
      const connectButton = $("btn-connect");

      function toPlugin(msg) {
        parent.postMessage({ pluginMessage: msg }, "*");
      }

      // ---------- 연결 상태 표시 ----------
      function setStatus(kind, text) {
        // kind: on | wait | off
        state.connected = kind === "on";
        $("dot").className = "dot" + (kind === "on" ? " on" : kind === "wait" ? " wait" : "");
        $("status").textContent = text;
        $("btn-copy").disabled = kind !== "on";
        connectButton.textContent = kind === "off" ? "연결" : "연결 끊기";
        portInput.disabled = kind !== "off";
        $("hint").innerHTML =
          kind === "off"
            ? "중계 서버가 꺼져 있으면 터미널에서 <code>talk-to-figma-socket</code> 을 실행하세요."
            : "Claude Code 에 붙여 넣으면 접속합니다.";
      }

      function randomChannel() {
        const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
        let s = "";
        for (let i = 0; i < 8; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
        return s;
      }

      function showChannel() {
        $("channel").textContent = state.channel || "--------";
      }

      // ---------- WebSocket ----------
      function connectToServer(port) {
        if (state.socket) return;
        // 연결할 때마다 새 채널 — 파일 두 개가 같은 채널에 붙는 일을 막는다
        state.channel = randomChannel();
        showChannel();
        state.serverPort = port;
        setStatus("wait", "연결 중…");
        let socket;
        try {
          socket = new WebSocket(`ws://localhost:${port}`);
        } catch (e) {
          setStatus("off", "연결 실패: " + (e && e.message ? e.message : e));
          return;
        }
        state.socket = socket;

        socket.onopen = () => {
          socket.send(JSON.stringify({ type: "join", channel: state.channel }));
        };

        socket.onmessage = (event) => {
          let data;
          try {
            data = JSON.parse(event.data);
          } catch (e) {
            console.error("메시지 해석 실패:", e);
            return;
          }
          if (data.type === "system" && data.message && data.message.result) {
            setStatus("on", `연결됨 · 포트 ${port}`);
            toPlugin({ type: "notify", message: `Talk to Figma 연결됨 (채널 ${state.channel})` });
          } else if (data.type === "error") {
            setStatus("off", "오류: " + data.message);
            socket.close();
          }
          handleSocketMessage(data);
        };

        socket.onclose = () => {
          if (state.socket === socket) state.socket = null;
          setStatus("off", "연결되지 않음");
        };

        socket.onerror = () => {
          setStatus("off", "중계 서버에 연결할 수 없음");
        };
      }

      function disconnectFromServer() {
        if (state.socket) {
          const s = state.socket;
          state.socket = null;
          s.close();
        }
        setStatus("off", "연결되지 않음");
      }

      function send(payload) {
        if (!state.socket || state.socket.readyState !== WebSocket.OPEN) return false;
        state.socket.send(JSON.stringify(payload));
        return true;
      }

      function handleSocketMessage(payload) {
        const data = payload.message;
        if (!data) return;

        if (data.id && state.pendingRequests.has(data.id)) {
          const { resolve, reject } = state.pendingRequests.get(data.id);
          state.pendingRequests.delete(data.id);
          data.error ? reject(new Error(data.error)) : resolve(data.result);
          return;
        }

        if (data.command) {
          state.activeRequestId = data.id;
          logStart(data.id, data.command);
          toPlugin({ type: "execute-command", id: data.id, command: data.command, params: data.params });
        }
      }

      function sendSuccessResponse(id, result) {
        send({ id, type: "message", channel: state.channel, message: { id, result } });
      }

      function sendErrorResponse(id, error) {
        send({ id, type: "message", channel: state.channel, message: { id, error, result: {} } });
      }

      function sendProgressUpdateToServer(progressData) {
        const id = state.activeRequestId || progressData.commandId;
        send({
          id,
          type: "progress_update",
          channel: state.channel,
          message: { id, type: "progress_update", data: progressData },
        });
      }

      // ---------- 진행 표시 ----------
      let progressHideTimer = null;
      function updateProgressUI(p) {
        clearTimeout(progressHideTimer);
        $("progress").classList.remove("hidden");
        const pct = Math.max(0, Math.min(100, p.progress || 0));
        $("progress-bar").style.width = pct + "%";
        $("progress-message").textContent = `${p.message || "진행 중"} (${pct}%)`;
        if (p.status === "completed" || p.status === "error") {
          progressHideTimer = setTimeout(() => $("progress").classList.add("hidden"), 4000);
        }
      }

      // ---------- 최근 명령 기록 ----------
      const LOG_MAX = 20;
      const log = []; // 최신이 앞

      function logStart(id, command) {
        log.unshift({ id, command, start: Date.now(), end: null, ok: null, error: null });
        if (log.length > LOG_MAX) log.length = LOG_MAX;
        renderLog();
      }

      function logEnd(id, ok, error) {
        const e = log.find((x) => x.id === id);
        if (!e) return;
        e.end = Date.now();
        e.ok = ok;
        e.error = error || null;
        renderLog();
      }

      function fmtMs(ms) {
        return ms < 1000 ? `${ms}ms` : `${(ms / 1000).toFixed(1)}s`;
      }

      function renderLog() {
        const ul = $("log");
        ul.textContent = "";
        $("log-empty").classList.toggle("hidden", log.length > 0);
        const fails = log.filter((x) => x.ok === false).length;
        $("log-count").textContent = log.length ? `${log.length}개${fails ? ` · 실패 ${fails}` : ""}` : "";
        const now = Date.now();
        for (const e of log) {
          const li = document.createElement("li");
          const mark = document.createElement("span");
          mark.className = "mark " + (e.ok === null ? "run" : e.ok ? "ok" : "bad");
          mark.textContent = e.ok === null ? "…" : e.ok ? "✓" : "✕";
          const cmd = document.createElement("span");
          cmd.className = "cmd";
          cmd.textContent = e.command;
          cmd.title = e.command;
          const ms = document.createElement("span");
          ms.className = "ms";
          ms.textContent = fmtMs((e.end || now) - e.start) + (e.ok === null ? " 진행 중" : "");
          li.append(mark, cmd, ms);
          if (e.error) {
            const err = document.createElement("span");
            err.className = "err";
            err.textContent = e.error.length > 160 ? e.error.slice(0, 160) + "…" : e.error;
            err.title = e.error;
            li.append(err);
          }
          ul.append(li);
        }
      }

      // 진행 중인 명령의 경과 시간을 갱신 — 멈춘 명령이 보이게
      setInterval(() => {
        if (log.some((x) => x.ok === null)) renderLog();
      }, 1000);

      // ---------- 버튼 ----------
      connectButton.addEventListener("click", () => {
        if (state.socket) disconnectFromServer();
        else connectToServer(parseInt(portInput.value, 10) || 3055);
      });

      $("btn-copy").addEventListener("click", () => {
        // Claude Code 에 그대로 붙여 넣는 문장
        const text = `${state.channel} 채널.`;
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.append(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        const b = $("btn-copy");
        b.textContent = "복사됨";
        setTimeout(() => (b.textContent = "복사"), 1500);
      });

      // ---------- 플러그인 본체(code.js)에서 오는 메시지 ----------
      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        switch (message.type) {
          case "file-info":
            $("file-name").textContent = message.fileName || "(이름 없는 파일)";
            $("file-page").textContent = message.pageName ? `현재 페이지 · ${message.pageName}` : "";
            break;
          case "init-settings":
            if (message.settings && message.settings.serverPort && !state.socket) {
              portInput.value = message.settings.serverPort;
            }
            break;
          case "auto-connect":
            if (!state.socket) connectButton.click();
            break;
          case "auto-disconnect":
            if (state.socket) connectButton.click();
            break;
          case "command-result":
            sendSuccessResponse(message.id, message.result);
            logEnd(message.id, true);
            break;
          case "command-error":
            sendErrorResponse(message.id, message.error);
            logEnd(message.id, false, message.error);
            break;
          case "command_progress":
            updateProgressUI(message);
            sendProgressUpdateToServer(message);
            break;
        }
      };

      setStatus("off", "연결되지 않음");
      renderLog();
    </script>
  </body>
</html>
